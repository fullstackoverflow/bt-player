name: Build Chrome Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建 Release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Get version from manifest
      id: version
      run: |
        VERSION=$(cat extension/manifest.json | grep -Po '(?<="version": ")[^"]*')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extension version: $VERSION"
    
    - name: Create ZIP package
      run: |
        cd extension
        zip -r ../bt-player-extension-v${{ steps.version.outputs.version }}.zip . -x "*.git*" "*.DS_Store"
        cd ..
        echo "✅ Extension ZIP packaged successfully"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bt-player-extension-v${{ steps.version.outputs.version }}
        path: bt-player-extension-v${{ steps.version.outputs.version }}.zip
        retention-days: 30
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bt-player-extension-v${{ steps.version.outputs.version }}.zip
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## 📦 安装说明
          
          ### 安装步骤
          1. 下载下方的 `bt-player-extension-v${{ steps.version.outputs.version }}.zip`
          2. 解压 ZIP 文件到任意**固定位置**(不要删除此文件夹)
          3. 打开 Chrome 浏览器,访问 `chrome://extensions/`
          4. 开启右上角的"开发者模式"
          5. 点击"加载已解压的扩展程序"
          6. 选择解压后的文件夹
          7. 完成!
          
          ### Edge 浏览器
          - 访问 `edge://extensions/`
          - 开启"开发人员模式"
          - 按照上述步骤操作
          
          ### 使用说明
          1. 点击浏览器工具栏的插件图标,设置服务器地址(如 `http://localhost:8080`)
          2. 在网站上右键点击 BT/磁力链接
          3. 选择"立即播放"
          4. 自动跳转到播放页面
          
          ### 常见问题
          - **右键菜单不显示?** 确认插件已启用且开启了必要权限
          - **点击菜单没反应?** 在插件设置中配置服务器地址
          - **视频无法播放?** 确认本地服务器已启动
          
          ---
          
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
