<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 16px;
        }
        .setting-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 13px;
        }
        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #4CAF50;
        }
        input[type="checkbox"] {
            cursor: pointer;
        }
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 3px;
            font-size: 12px;
            text-align: center;
            display: none;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .hint {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <h3>BT播放器设置</h3>
    
    <div id="step1">
        <div class="setting-group">
            <label for="serverUrl">服务端地址：</label>
            <input type="text" id="serverUrl" placeholder="http://localhost:3000">
            <div class="hint">输入完整地址，如：http://localhost:3000</div>
        </div>
        
        <button id="connect">连接服务器</button>
        
        <div id="status" class="status"></div>
    </div>
    
    <div id="step2" style="display: none;">
        <div style="display: flex; align-items: center; margin-bottom: 15px;">
            <button id="back" style="width: auto; padding: 5px 10px; margin-right: 10px; background-color: #666;">← 返回</button>
        </div>
        
        <div class="setting-group">
            <label>
                <input type="checkbox" id="enableSeeding" style="width: auto; margin-right: 5px;">
                启用做种
            </label>
            <div class="hint">关闭后将不会上传数据给其他节点</div>
        </div>
        
        <div class="setting-group">
            <label for="storageLimit">存储上限（GB）：</label>
            <input type="number" id="storageLimit" placeholder="0" min="0" style="width: 100%;">
            <div class="hint">0 表示不限制，超过限制会自动清理旧文件</div>
        </div>
        
        <button id="saveConfig">保存配置</button>
        
        <div id="configStatus" class="status"></div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
